<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magical Hearts</title>

<style>

body{
margin:0;
background:#02010a;
overflow:hidden;
font-family:cursive;
}

canvas{
display:block;
}

.title{
position:absolute;
top:40px;
width:100%;
text-align:center;
font-size:42px;
color:#ffc0cb;
letter-spacing:3px;

text-shadow:
0 0 10px pink,
0 0 20px hotpink,
0 0 40px purple,
0 0 80px violet;
}

.subtitle{
position:absolute;
top:95px;
width:100%;
text-align:center;
color:#aaa;
letter-spacing:5px;
font-size:14px;
}

</style>
</head>

<body>

<div class="title">✨ Magical Hearts ✨</div>
<div class="subtitle">A UNIVERSE MADE OF LOVE</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
let stars = [];

function heart(t){

return {

x: 16*Math.pow(Math.sin(t),3),

y: 13*Math.cos(t)
   -5*Math.cos(2*t)
   -2*Math.cos(3*t)
   -Math.cos(4*t)

};

}

for(let i=0;i<2000;i++){

let t = Math.random()*Math.PI*2;

let pos = heart(t);

particles.push({

x: pos.x*18,
y: -pos.y*18,
angle: Math.random()*360,
size: Math.random()*2+1,
speed: Math.random()*0.15+0.02

});

}

for(let i=0;i<400;i++){

stars.push({

x: Math.random()*canvas.width,
y: Math.random()*canvas.height,
size: Math.random()*2

});

}

let mouseX = 0;
let mouseY = 0;

window.addEventListener("mousemove",e=>{
mouseX = e.clientX;
mouseY = e.clientY;
});

function drawStars(){

stars.forEach(s=>{

ctx.beginPath();
ctx.fillStyle="white";
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();

});

}

function animate(){

ctx.fillStyle="rgba(0,0,20,0.25)";
ctx.fillRect(0,0,canvas.width,canvas.height);

drawStars();

ctx.save();
ctx.translate(canvas.width/2,canvas.height/2);

particles.forEach(p=>{

let rad = p.angle*Math.PI/180;

let x = p.x*Math.cos(rad) - p.y*Math.sin(rad);
let y = p.x*Math.sin(rad) + p.y*Math.cos(rad);

let distX = (mouseX - canvas.width/2)/50;
let distY = (mouseY - canvas.height/2)/50;

ctx.beginPath();

let hue = (Date.now()/20 + p.x) % 360;

ctx.fillStyle = "hsl("+hue+",100%,70%)";

ctx.shadowBlur = 15;
ctx.shadowColor = "hsl("+hue+",100%,60%)";

ctx.arc(x+distX,y+distY,p.size,0,Math.PI*2);
ctx.fill();

p.angle += p.speed;

});

ctx.restore();

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
